services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/data/epiblock.db
      - CORS_ORIGIN=*
    volumes:
      - epiblock-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    environment:
      - API_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  epiblock-data:
